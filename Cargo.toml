[workspace]
resolver = "2"
members = ["crates/board", "crates/vision", "crates/camera", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.11"
nalgebra = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36.1"
egui = "0.36.1"
v4l = "0.14"
zune-jpeg = "0.5"
crossbeam-channel = "0.5"
pcbv-board = { path = "crates/board" }
pcbv-vision = { path = "crates/vision" }
pcbv-camera = { path = "crates/camera" }

# Realtime work in the dev profile: the crates here at a light optimization
# level, every dependency fully optimized, so a plain build keeps frame rate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
